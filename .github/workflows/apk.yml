name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Comprobar clave de firma
        id: firma
        env:
          KS_B64: ${{ secrets.NEXO_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.NEXO_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::warning title=Sin clave de firma::Faltan los Secrets NEXO_KEYSTORE_B64 y/o NEXO_KEYSTORE_PASSWORD. Solo se comprueba que compila; no se publica APK."
            echo "hay=no" >> "$GITHUB_OUTPUT"
          else
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/nexo.p12"
            echo "hay=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Configuración de Firebase
        id: firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning title=Sin google-services.json::Falta el Secret GOOGLE_SERVICES_JSON. Se compila con una configuración de prueba solo para comprobar el código; no se publica APK."
            cp ci/google-services-prueba.json app/google-services.json
            echo "real=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          python3 - <<'PY'
          import json
          d = json.load(open("app/google-services.json"))
          apps = [c for c in d.get("client", []) if c["client_info"]["android_client_info"]["package_name"] == "com.nexo.vita"]
          if not apps:
              print("::error title=google-services.json::No contiene la app com.nexo.vita"); raise SystemExit(1)
          web = [o for o in apps[0].get("oauth_client", []) if o.get("client_type") == 3]
          if not web:
              print("::error title=google-services.json::No contiene el cliente web de OAuth (client_type 3). Comprueba que Google está activado en Authentication y que la huella SHA-1 está añadida, y vuelve a descargar el archivo."); raise SystemExit(1)
          print("google-services.json correcto: proyecto", d["project_info"]["project_id"])
          PY
          echo "real=si" >> "$GITHUB_OUTPUT"

      - name: Pruebas y compilación
        env:
          NEXO_KEYSTORE_FILE: ${{ steps.firma.outputs.hay == 'si' && format('{0}/nexo.p12', runner.temp) || '' }}
          NEXO_KEYSTORE_PASSWORD: ${{ secrets.NEXO_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          if [ "${{ steps.firma.outputs.hay }}" = "si" ] && [ "${{ steps.firebase.outputs.real }}" = "si" ]; then TAREA=assembleRelease; else TAREA=assembleDebug; fi
          gradle --no-daemon testDebugUnitTest "$TAREA" 2>&1 | tee build.log

      - name: Errores de compilación como anotaciones
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          resumen=$(grep -E -A6 '^e: |What went wrong|FAILED$|error:|expected:<' build.log | head -n 80)
          [ -n "$resumen" ] || resumen=$(tail -n 60 build.log)
          resumen="${resumen//'%'/'%25'}"
          resumen="${resumen//$'\r'/}"
          resumen="${resumen//$'\n'/'%0A'}"
          echo "::error title=Gradle::${resumen}"

      - name: Publicar APK en Releases
        if: steps.firma.outputs.hay == 'si' && steps.firebase.outputs.real == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          APK="NEXO-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          echo "SHA-1 del certificado de firma:"
          keytool -printcert -jarfile "$APK" | grep -E 'SHA1|SHA-1' || true
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release upload "v$VERSION" "$APK" --clobber
          else
            gh release create "v$VERSION" "$APK" --title "NEXO $VERSION" --notes "APK firmado de NEXO $VERSION. Instálalo a mano en el móvil."
          fi
          echo "::notice title=APK publicado::$APK en la release v$VERSION"
